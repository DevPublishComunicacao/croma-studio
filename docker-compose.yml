services:
  postgres:
    image: postgres:16-alpine
    container_name: croma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-croma}
      POSTGRES_USER: ${POSTGRES_USER:-croma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-croma_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - croma-postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  croma-postgres-data:
